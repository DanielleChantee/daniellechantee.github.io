<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found | Danielle Adeyemo</title>
    <link rel="canonical" href="{{ site.url }}{{ site.baseurl }}/" />
    <script>
      (function () {
        var path = window.location.pathname;
        if (path && path !== "/404.html" && path.endsWith(".html")) {
          var cleanPath = path.replace(/\.html$/, "/");
          window.location.replace(cleanPath + window.location.search + window.location.hash);
          return;
        }
        window.location.replace("{{ '/' | relative_url }}");
      })();
    </script>
  </head>
  <body>
    <p>Page not found. <a href="{{ '/' | relative_url }}">Go to homepage</a></p>
  </body>
</html>
