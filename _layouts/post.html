---
layout: default
type: article
---

<div class="client-work-image-banner image-banner">
  <div class="image-banner-content">
    <h1>{{ page.title }}</h1>
    <h2>{{ page.description }}</h2>
  </div>
</div>

<section class="about content-section article">
  <div class="content article-body">
    {{ content }}
  </div>
</section>

<section class="about content-section cta-section">
  <div class="content">
    <h2>Need a Shopify Plus developer?</h2>
    <p>Send over what you are working on and I will get back to you.</p>
    <div class="button-row">
      <a href="{{ '/contact/' | relative_url }}" class="btn btn-primary glow-black">Get in Touch</a>
      <a href="{{ '/blog/' | relative_url }}" class="btn btn-secondary glow-black">More Articles</a>
    </div>
  </div>
</section>

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Article",
  "headline": {{ page.title | jsonify }},
  "description": {{ page.description | jsonify }},
  "datePublished": "{{ page.date | date_to_xmlschema }}",
  "dateModified": "{{ page.last_modified_at | default: page.date | date_to_xmlschema }}",
  "mainEntityOfPage": "{{ site.url }}{{ site.baseurl }}{{ page.url }}",
  "author": {
    "@type": "Person",
    "name": "Danielle Adeyemo",
    "url": "{{ site.url }}{{ site.baseurl }}/about/"
  }
}
</script>
